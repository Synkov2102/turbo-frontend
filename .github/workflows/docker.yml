name: Build, Push & Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set image name (lowercase)
        id: img
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> $GITHUB_OUTPUT
          echo "IMAGE_SHA=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Extract API URL from .env.production
        id: env
        run: |
          if [ -f .env.production ]; then
            echo "Found .env.production file"
            cat .env.production
            # Extract value after = sign, trim whitespace, remove quotes
            API_URL=$(grep "^NEXT_PUBLIC_API_URL=" .env.production | sed 's/^NEXT_PUBLIC_API_URL=//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's/^"//;s/"$//' | sed "s/^'//;s/'$//")
            if [ -z "$API_URL" ] || [ "$API_URL" = "" ]; then
              echo "Warning: API_URL is empty or not found, using default"
              API_URL="https://turbo20.ru/api"
            fi
            echo "API_URL=${API_URL}" >> $GITHUB_OUTPUT
            echo "Extracted API_URL: [${API_URL}]"
            echo "Length: ${#API_URL}"
          else
            echo ".env.production not found, using default"
            API_URL="https://turbo20.ru/api"
            echo "API_URL=${API_URL}" >> $GITHUB_OUTPUT
            echo "Using default API_URL: ${API_URL}"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.env.outputs.API_URL }}
          tags: |
            ${{ steps.img.outputs.IMAGE }}
            ${{ steps.img.outputs.IMAGE_SHA }}

      - name: Deploy on VPS (ssh)
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh -o StrictHostKeyChecking=no -p 22 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd ${{ secrets.VPS_APP_DIR }} && docker compose pull && docker compose up -d && docker image prune -f"
